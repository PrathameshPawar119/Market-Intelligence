[project]
name = "market-intelligence"
version = "0.1.0"
description = "Market Intelligence AI Service"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.128.8",
    "httpx>=0.28.1",
    "langchain>=0.3.30",
    "langchain-anthropic>=0.3.35",
    "langchain-google-genai>=2.2.0",
    "langchain-openai>=0.3.35",
    "langgraph>=0.6.11",
    "pydantic-settings>=2.11.0",
    "python-dotenv>=1.2.1",
    "uvicorn[standard]>=0.39.0",
]

[project.scripts]
market-intelligence = "market_intelligence.main:app"

[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8.4.2",
    "pytest-asyncio>=1.2.0",
    "ruff>=0.16.5",
]
